<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Redirecting… | Little Paws By Miles</title>
  <!-- Per-cat content is now served from /cats/<id>.html (real HTML
       files for SEO and faster first paint). This page just redirects
       legacy /cat.html?id=X URLs through to the new canonical URL. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://littlepawsbymiles.co.uk/cats">
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var id = p.get('id');
      if (id) {
        location.replace('/cats/' + encodeURIComponent(id));
      } else {
        location.replace('/cats');
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/cats">
</head>
<body>
  <p>Cat profile pages have moved. <a href="/cats">Click here if you are not redirected automatically</a>.</p>
</body>
</html>

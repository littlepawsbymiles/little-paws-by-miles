<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Redirecting… | Little Paws By Miles</title>
  <!-- Per-litter content is now served from /litters/<id>.html (real
       HTML files for SEO and faster first paint). This page just
       redirects legacy /litter.html?id=X URLs through to the new
       canonical URL. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://littlepawsbymiles.co.uk/litters.html">
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var id = p.get('id');
      if (id) {
        location.replace('/litters/' + encodeURIComponent(id) + '.html');
      } else {
        location.replace('/litters.html');
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/litters.html">
</head>
<body>
  <p>Litter pages have moved. <a href="/litters.html">Click here if you are not redirected automatically</a>.</p>
</body>
</html>
